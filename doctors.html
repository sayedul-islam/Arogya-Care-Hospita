<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find Arogya Care Hospital doctors and specialists.">
    <title>Doctors | Arogya Care Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="nav"></div>
    <main>
        <section class="page-head">
            <div class="container">
                <div class="eyebrow"><span></span> Our specialists</div>
                <h1>Find the right <em>specialist.</em></h1>
                <p>Meet experienced doctors across our key departments.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="filters">
                    <div class="search-box"><span>⌕</span><input type="search" id="search"
                            placeholder="Search doctor name..." aria-label="Search doctor name"></div><select
                        id="filter" aria-label="Filter by department">
                        <option value="">All departments</option>
                    </select>
                </div>
                <div class="grid grid-4" id="doctor-grid"></div>
                <p id="empty" class="empty-state" hidden>No doctor found. Try another name or department.</p>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="js/script.js"></script>
</body>

</html>
